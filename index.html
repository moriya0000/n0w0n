<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>関東鉄道常総線 列車位置</title>
<style>
:root{--bg:#f4f6f8;--card:#fff;--ink:#1d2733;--sub:#5d6b7a;--line:#cfd7df;--dn:#1a5fb4;--up:#2b8a57;--kai:#d6336c;--ac:#ffcd26}
@media (prefers-color-scheme:dark){:root{--bg:#10161d;--card:#1a232d;--ink:#e6edf3;--sub:#9aa8b6;--line:#34414e;--dn:#4c8fe0;--up:#3dae74}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 "Hiragino Sans","Yu Gothic UI","Meiryo",sans-serif}
header{display:flex;flex-wrap:wrap;align-items:center;gap:8px 20px;padding:12px 16px;background:var(--card);border-bottom:3px solid var(--ac)}
h1{margin:0;font-size:18px}
#clock{font:600 26px/1 ui-monospace,Menlo,Consolas,monospace;letter-spacing:.04em}
.ctl{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-left:auto;font-size:13px}
select,input,button{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:3px 8px}
button{cursor:pointer}
#info{padding:6px 16px;color:var(--sub);font-size:12px}
#wrap{margin:0 12px;overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:8px}
#board{position:relative;height:306px}
.st{position:absolute;top:6px;width:18px;margin-left:-9px;writing-mode:vertical-rl;font-size:24px;line-height:18px;white-space:nowrap;text-align:left;height:96px}
.st.big{font-weight:700;color:var(--ac)}
.dot{position:absolute;top:196px;width:12px;height:12px;margin-left:-6px;border-radius:50%;background:var(--card);border:3px solid var(--ink)}
.dot.big{width:16px;height:16px;margin-left:-8px;top:194px}
.rail{position:absolute;top:199px;height:6px;border-top:2px solid var(--ink);border-bottom:2px solid var(--ink)}
.rail.s{height:2px;border:0;background:var(--ink);top:201px}
.lane{position:absolute;left:6px;font-size:11px;color:var(--sub)}
.tr{position:absolute;height:48px;padding:2px 6px;border-radius:6px;color:#fff;font-size:18px;line-height:1.25;cursor:pointer;transition:left 1s linear;box-shadow:0 1px 3px rgba(0,0,0,.35);overflow:hidden;white-space:nowrap}
.tr.d{background:var(--dn)}.tr.u{background:var(--up)}
.tr.k{outline:2px solid var(--kai)}
.tr.sel{outline:3px solid var(--ac);z-index:5}
.tr b{font-size:16px}
.tr i{font-style:normal;background:var(--kai);padding:0 3px;border-radius:3px;margin-left:3px}
#panel{margin:12px;padding:12px 14px;background:var(--card);border:1px solid var(--line);border-radius:8px;min-height:72px}
#stops{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:6px;font-size:12px}
#stops span.past{color:var(--sub);opacity:.55}
#stops span.now{color:var(--ac);font-weight:700}
footer{padding:4px 16px 16px;color:var(--sub);font-size:12px}
#stat{position:absolute;inset:0}
.gl{position:absolute;top:104px;bottom:0;border-left:1px dashed var(--line)}
.pin{position:absolute;width:2px;margin-left:-1px;z-index:1}
.pin::after{content:'';position:absolute;left:-5px;width:12px;height:12px;border-radius:50%;background:inherit;border:2px solid var(--card)}
.pin.d{background:var(--dn)}.pin.u{background:var(--up)}
.pin.d::after{bottom:-6px}.pin.u::after{top:-6px}
.tr{z-index:2;width:92px;margin-left:-46px}
.tr.sel{z-index:5}
.tr i.dl{background:var(--ac)}
#dl{padding:0 16px;display:flex;flex-wrap:wrap;gap:6px}
#dl button{font-size:12px;padding:1px 8px;border-color:var(--ac)}
#dctl{margin-top:8px;display:none;align-items:center;gap:6px;flex-wrap:wrap}
#dctl input{width:72px}
#dctl small{color:var(--sub)}
</style>
</head>

  </div>
</header>
<div id="info"></div>
<div id="dl"></div>
<div id="wrap"><div id="board"><div id="stat"></div></div></div>

function holidays(y){
  const h=new Set(),k=(m,d)=>y+'-'+m+'-'+d;
  const nth=(m,w,n)=>{const f=new Date(y,m-1,1).getDay();return 1+(w-f+7)%7+7*(n-1)};
  [[1,1],[2,11],[2,23],[4,29],[5,3],[5,4],[5,5],[8,11],[11,3],[11,23]].forEach(a=>h.add(k(...a)));
  h.add(k(1,nth(1,1,2)));h.add(k(7,nth(7,1,3)));h.add(k(9,nth(9,1,3)));h.add(k(10,nth(10,1,2)));
  const a=y-1980,sh=Math.floor(20.8431+0.242194*a-Math.floor(a/4)),au=Math.floor(23.2488+0.242194*a-Math.floor(a/4));
  h.add(k(3,sh));h.add(k(9,au));
  const base=[...h].map(s=>{const p=s.split('-');return new Date(y,p[1]-1,p[2])});
  base.forEach(d=>{if(d.getDay()===0){let n=new Date(d);do{n.setDate(n.getDate()+1)}while(h.has(k(n.getMonth()+1,n.getDate())));h.add(k(n.getMonth()+1,n.getDate()))}});
  for(let m=1;m<=12;m++)for(let d=2;d<=30;d++){const t=new Date(y,m-1,d);if(t.getDay()&&!h.has(k(m,d))&&h.has(k(m,d-1))&&h.has(k(m,d+1)))h.add(k(m,d))}
  return h;
}
function dayType(d){
  const m=d.getMonth()+1,dd=d.getDate(),w=d.getDay();
  if((m===12&&dd>=29)||(m===1&&dd<=3))return'hd';
  if(w===0||w===6)return'hd';
  return holidays(d.getFullYear()).has(d.getFullYear()+'-'+m+'-'+dd)?'hd':'wd';
}

  const vis=[];
  T.forEach(tr=>{if(tr.day!==day)return;const loc=locate(tr,mm-(DL[tr.id]||0));if(loc)vis.push({tr,loc})});
  const used=new Set();
  [0,1].forEach(up=>{
    const L=vis.filter(v=>v.tr.up===up).sort((a,b)=>a.loc.x-b.loc.x);
    let last=-1e9,lv=0;
    L.forEach(v=>{
      const tr=v.tr,dly=DL[tr.id]||0;
      lv=(v.loc.x-last<96)?lv^1:0;last=v.loc.x;
      let o=els.get(tr.id);
      if(!o){
        const e=document.createElement('div'),p=document.createElement('div');
        e.onclick=()=>{sel=tr.id;tick()};
        board.appendChild(p);board.appendChild(e);o={e,p};els.set(tr.id,o);
      }
      const early=tr.pre&&v.loc.cur<=tr.ks,num=early?tr.pre:tr.no,dest=early?'水海道':S[tr.p[tr.p.length-1][0]];
      o.e.className='tr '+(up?'u':'d')+(tr.k?' k':'')+(sel===tr.id?' sel':'');
      o.e.innerHTML='<b>'+(up?'◀ '+num:num+' ▶')+'</b>'+(tr.k?'<i>快速</i>':'')+(dly?'<i class="dl">'+(dly>0?'+':'')+dly+'</i>':'')+'<br>'+dest+'行';
      const top=up?216+lv*40:108+lv*40;
      o.e.style.left=o.p.style.left=v.loc.x+'px';
      o.e.style.top=top+'px';
      o.p.className='pin '+(up?'u':'d');
      o.p.style.top=(up?202:top+36)+'px';
      o.p.style.height=(up?top-202:202-top-36)+'px';
      used.add(tr.id);
    });
  });
  for(const[id,o]of els)if(!used.has(id)){o.e.remove();o.p.remove();els.delete(id)}
  const nd=vis.filter(v=>!v.tr.up).length;
  $('info').textContent='運行中 '+vis.length+'本（下り '+nd+'本 / 上り '+(vis.length-nd)+'本）';
  const sig=Object.keys(DL).join(',')+'|'+Object.values(DL).join(',');
  if(sig!==dlSig){
    dlSig=sig;
    $('dl').innerHTML=Object.keys(DL).map(id=>'<button data-id="'+id+'">'+T[id].no+'列車 '+(DL[id]>0?'+':'')+DL[id]+'分</button>').join('');
  }
  const pt=$('pt'),st=$('stops');
  if(sel===null){pt.textContent='列車をクリックすると詳細を表示します。';st.innerHTML='';$('dctl').style.display='none';return}
  $('dctl').style.display='flex';
  if(shown!==sel){shown=sel;$('dmin').value=DL[sel]||0}
  const tr=T[sel],dly=DL[sel]||0,p=tr.p;
  const head='<b>'+(tr.up?'上り':'下り')+' '+(tr.pre?tr.pre+'列車（水海道から'+tr.no+'列車）':tr.no+'列車')+'</b>　'+(tr.k?'快速':'普通')+'　'+S[p[0][0]]+' → '+S[p[p.length-1][0]]+(dly?'　<span style="color:var(--ac)">遅延'+(dly>0?'+':'')+dly+'分（時刻は遅延反映後）</span>':'');
  const cv=vis.find(v=>v.tr.id===sel);
  pt.innerHTML=head+'<br>'+(cv?'現在：'+cv.loc.txt:(tr.day!==day?'この列車は'+(tr.day==='wd'?'平日':'土休日')+'ダイヤです。':'現在は運行時間外です。'));
  const cur=cv?cv.loc.cur:-9;
  st.innerHTML=p.map((q,k)=>{
    const a=fmt(q[1]+dly),d=fmt(q[2]+dly);
    const tt=k===0?'発 '+d:k===p.length-1?'着 '+a:TWO.includes(q[0])?'着 '+a+' 発 '+d:a;
    const c=cv?(k<=cur-.5?'past':(k===cur?'now':'')):'';
    return'<span class="'+c+'">'+S[q[0]]+(tr.ks===k?'（乗換）':'')+' '+tt+'</span>';
  }).join('');
}
$('mode').onchange=tick;
$('zoom').oninput=e=>{SC=+e.target.value;build();tick()};
$('sim').onchange=e=>{const v=e.target.value;if(!v)sim=null;else{const[h,mi]=v.split(':').map(Number);sim={base:h*60+mi,at:Date.now()}}tick()};
$('now').onclick=()=>{sim=null;$('sim').value='';tick()};
$('dset').onclick=()=>{if(sel!==null)setDelay(sel,parseFloat($('dmin').value)||0)};
$('dclr').onclick=()=>{if(sel!==null){$('dmin').value=0;setDelay(sel,0)}};
$('dmin').onkeydown=e=>{if(e.key==='Enter')$('dset').click()};
$('dl').onclick=e=>{const b=e.target.closest('button');if(b){sel=+b.dataset.id;tick()}};
build();tick();setInterval(tick,1000);
</script>
</body>
</html>
